# Every push and pull request: run all the tests.
# Every push to main (after tests pass): deploy to Cloudflare -> https://rufustrivia.com
#
# One-time setup (GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret):
#   CLOUDFLARE_API_TOKEN   Cloudflare dashboard -> My Profile -> API Tokens -> Create Token ->
#                          "Edit Cloudflare Workers" template (account + the rufustrivia.com zone)
#   CLOUDFLARE_ACCOUNT_ID  the long id in your Cloudflare dashboard URL
# Until those exist, this still runs the tests and just skips the deploy.

name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests (thousands of generated questions)
        run: npm test

      - name: End-to-end tests (plays solo + a challenge room on a local Cloudflare runtime)
        run: |
          npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler-dev.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8787/api/meta > /dev/null && break; sleep 1; done
          npm run test:e2e

      - name: Server log (only shown if something failed)
        if: failure()
        run: tail -n 120 wrangler-dev.log || true

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_CF_TOKEN == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy skipped
        if: github.event_name != 'pull_request' && env.HAS_CF_TOKEN != 'true'
        run: echo "::notice::Tests passed. Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to turn on auto-deploy."
